services:
  - type: web
    name: tara-finance-agent
    runtime: node
    buildCommand: npm install
    startCommand: npx tsx src/api/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
