services:
  - type: web
    name: tara-finance-agent
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GOOGLE_API_KEY
        sync: false   # fill in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: tara-postgres
          property: connectionString

databases:
  - name: tara-postgres
    plan: free
    databaseName: provue_tara
    user: tara
